            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.2);

            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);

        /* Offscreen texture generator canvas */

            width: 120px;
            height: 28px;
            border-radius: 4px;
        }

    <!-- Application Script -->
    <script>
        // --- 0. Music Visualizer & Web Audio Analyzer Engine ---
        class MusicRhythmEngine {
            constructor() {
                this.audioCtx = null;
                this.analyser = null;
                this.audioElement = new Audio();
                this.sourceNode = null;
                this.dataArray = null;
                this.isPlaying = false;
                this.sensitivity = 1.5;

                // Frequency Bands
                this.bass = 0;
                this.mid = 0;
                this.treble = 0;
                this.average = 0;
                this.beatHit = false;
                this.lastBass = 0;

                this.visualizerCanvas = document.getElementById('visualizer-canvas');
                this.vCtx = this.visualizerCanvas ? this.visualizerCanvas.getContext('2d') : null;

                this.audioElement.addEventListener('ended', () => {
                    this.isPlaying = false;
                    const playIcon = document.getElementById('play-icon');
                    if (playIcon) playIcon.className = 'fa-solid fa-play text-xs';
                });
            }

            init() {
                if (!this.audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.audioCtx = new AudioContext();
                    this.analyser = this.audioCtx.createAnalyser();
                    this.analyser.fftSize = 256;
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

                    this.sourceNode = this.audioCtx.createMediaElementSource(this.audioElement);
                    this.sourceNode.connect(this.analyser);
                    this.analyser.connect(this.audioCtx.destination);
                }
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
            }

            loadTrack(file) {
                this.init();
                const url = URL.createObjectURL(file);
                this.audioElement.src = url;
                this.audioElement.load();
                this.play();
            }

            play() {
                this.init();
                this.audioElement.play().then(() => {
                    this.isPlaying = true;
                    const playIcon = document.getElementById('play-icon');
                    if (playIcon) playIcon.className = 'fa-solid fa-pause text-xs';
                }).catch(err => {
                    console.log("Audio play prevented:", err);
                });
            }

            pause() {
                this.audioElement.pause();
                this.isPlaying = false;
                const playIcon = document.getElementById('play-icon');
                if (playIcon) playIcon.className = 'fa-solid fa-play text-xs';
            }

            togglePlay() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }

            update() {
                if (!this.analyser || !this.isPlaying) {
                    // Decay values if paused
                    this.bass *= 0.9;
                    this.mid *= 0.9;
                    this.treble *= 0.9;
                    this.average *= 0.9;
                    this.beatHit = false;
                    this.drawVisualizer();
                    return;
                }

                this.analyser.getByteFrequencyData(this.dataArray);
                const count = this.dataArray.length;

                let sumBass = 0, sumMid = 0, sumTreble = 0, sumTotal = 0;
                
                // Low Freq (0 - 8): Bass
                for (let i = 0; i < 8; i++) {
                    sumBass += this.dataArray[i];
                }
                // Mid Freq (8 - 40)
                for (let i = 8; i < 40; i++) {
                    sumMid += this.dataArray[i];
                }
                // Treble Freq (40 - 128)
                for (let i = 40; i < count; i++) {
                    sumTreble += this.dataArray[i];
                }
                for (let i = 0; i < count; i++) {
                    sumTotal += this.dataArray[i];
                }

                this.bass = (sumBass / 8 / 255) * this.sensitivity;
                this.mid = (sumMid / 32 / 255) * this.sensitivity;
                this.treble = (sumTreble / (count - 40) / 255) * this.sensitivity;
                this.average = (sumTotal / count / 255) * this.sensitivity;

                // Beat detection
                if (this.bass > 0.6 && (this.bass - this.lastBass) > 0.15) {
                    this.beatHit = true;
                } else {
                    this.beatHit = false;
                }
                this.lastBass = this.bass;

                this.drawVisualizer();

            drawVisualizer() {
                if (!this.vCtx) return;
                const w = this.visualizerCanvas.width;
                const h = this.visualizerCanvas.height;
                this.vCtx.clearRect(0, 0, w, h);

                if (!this.dataArray) return;
                const barWidth = w / 16;
                for (let i = 0; i < 16; i++) {

        // --- 1. Ambient Audio Engine ---
        class SphereAudioEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.ambientOsc = null;
                this.gainNode = null;
                this.presetSoundTimer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            toggle() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                if (this.isPlaying) {
                    this.stop();
                } else {
                    this.start();
                }
                return this.isPlaying;
            }

            start() {
                if (this.isPlaying) return;
                this.isPlaying = true;

                this.ambientOsc = this.ctx.createOscillator();
                const filter = this.ctx.createBiquadFilter();
                this.gainNode = this.ctx.createGain();

                this.ambientOsc.type = 'sawtooth';
                this.ambientOsc.frequency.setValueAtTime(55, this.ctx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(220, this.ctx.currentTime);

                this.gainNode.gain.setValueAtTime(0.08, this.ctx.currentTime);

                this.ambientOsc.connect(filter);
                filter.connect(this.gainNode);
                this.gainNode.connect(this.ctx.destination);

                this.ambientOsc.start();
                this.triggerRandomBeeps();
            }

            stop() {
                if (!this.isPlaying) return;
                this.isPlaying = false;
                if (this.ambientOsc) {
                    this.ambientOsc.stop();
                    this.ambientOsc.disconnect();
                }
                if (this.presetSoundTimer) clearTimeout(this.presetSoundTimer);
            }

            triggerRandomBeeps() {
                if (!this.isPlaying) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const freq = [220, 277.18, 329.63, 440, 554.37, 659.25][Math.floor(Math.random() * 6)];

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 1.5);

                this.presetSoundTimer = setTimeout(() => this.triggerRandomBeeps(), 1500 + Math.random() * 2500);
            }

            playFireworkPop() {
                if (!this.isPlaying && !musicEngine.isPlaying) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        }

        // --- 2. Dynamic Procedural Canvas Texture Generator ---
        class FacadeTextureGenerator {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                this.currentPreset = 'halloween';
                this.activeEmoji = 'happy';
                this.landmarkIndex = 0;
                this.tour = false;
                this.tourTimer = 0;
                this.onLandmarkChange = null;
                this.customEmoji = { text: '🚀', mode: 'single', size: 280, bg: '#2a1f6b' };
                this._emojiKey = null;
                this._emojiList = ['🚀'];
                this.time = 0;
                
                this.params = {
                    mode: 'matrix',
                    text: 'WELCOME TO VEGAS',
                    color1: '#00f0ff',
                    color2: '#ff00a0',
                    speed: 1.0,
                    density: 64,
                    intensity: 1.5
                };

                this.snowflakes = Array.from({ length: 120 }, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    r: Math.random() * 3 + 1,
                    s: Math.random() * 1.5 + 0.5
                }));

                this.hearts = Array.from({ length: 30 }, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    size: Math.random() * 15 + 10,
                    speed: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.7 + 0.3
                }));

                this.lanterns = Array.from({ length: 18 }, () => ({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    scale: Math.random() * 0.4 + 0.6,
                    speed: Math.random() * 0.8 + 0.4
                }));

                this.fireworks = [];
            }

            update(delta) {
                // Incorporate music speed boost if music is playing
                const musicSpeedBoost = musicEngine.isPlaying ? (1 + musicEngine.bass * 1.5) : 1;
                this.time += delta * this.params.speed * musicSpeedBoost;

                if (this.currentPreset === 'landmarks' && this.tour) {
                    this.tourTimer += delta;
                    if (this.tourTimer > 7) {
                        this.tourTimer = 0;
                        this.landmarkIndex = (this.landmarkIndex + 1) % LANDMARKS.length;
                        if (this.onLandmarkChange) this.onLandmarkChange(this.landmarkIndex);
                    }
                }

                this.ctx.fillStyle = '#000000';
                this.ctx.fillRect(0, 0, this.width, this.height);

                switch (this.currentPreset) {
                    case 'halloween':
                        this.renderHalloween();
                        break;
                    case 'christmas':
                        this.renderChristmas();
                        break;
                    case 'fireworks':
                        this.renderFireworks();
                        break;
                    case 'mid_autumn':
                        this.renderMidAutumn();
                        break;
                    case 'valentine':
                        this.renderValentine();
                        break;
                    case 'lantern':
                        this.renderLanternFest();
                        break;
                    case 'cyberpunk':
                        this.renderCyberpunk();
                        break;
                    case 'landmarks':
                        this.renderLandmarks();
                        break;
                    case 'emoji':
                        this.render10EmojiPack();
                        break;
                    case 'earth':
                        this.renderEarth();
                        break;
                    case 'custom':
                        this.renderCustom();
                        break;
                }

                this.applyLEDMatrixOverlay();
            }

            applyLEDMatrixOverlay() {
                const step = Math.floor(1024 / this.params.density);
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                for (let x = 0; x < this.width; x += step) {
                    this.ctx.fillRect(x, 0, 1, this.height);
                }
                for (let y = 0; y < this.height; y += step) {
                    this.ctx.fillRect(0, y, this.width, 1);
                }
            }

            // 1. Halloween
            renderHalloween() {
                const w = this.width;
                const h = this.height;
                const grad = this.ctx.createLinearGradient(0, 0, 0, h);
                const pulse = Math.sin(this.time * 3) * 0.15 + 0.85 + (musicEngine.bass * 0.4);
                grad.addColorStop(0, '#1a0500');
                grad.addColorStop(0.5, '#d94800');
                grad.addColorStop(1, '#3a0800');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, w, h);

                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                this.ctx.lineWidth = 12;
                for (let i = 0; i < w; i += 90) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i, 0);
                    this.ctx.quadraticCurveTo(i + 30 * Math.sin(i), h / 2, i, h);
                    this.ctx.stroke();
                }

                const cx = w * 0.5;
                const cy = h * 0.48;

                this.ctx.fillStyle = `#ffea00`;
                this.ctx.shadowColor = '#ff5500';
                this.ctx.shadowBlur = 40 * pulse;

                const eyePulse = Math.sin(this.time * 5) * 5 + (musicEngine.mid * 20);
                
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 160, cy - 60);
                this.ctx.lineTo(cx - 80, cy - 120 + eyePulse);
                this.ctx.lineTo(cx - 60, cy - 30);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.moveTo(cx + 160, cy - 60);
                this.ctx.lineTo(cx + 80, cy - 120 + eyePulse);
                this.ctx.lineTo(cx + 60, cy - 30);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.beginPath();
                this.ctx.moveTo(cx, cy - 20);
                this.ctx.lineTo(cx - 25, cy + 20);
                this.ctx.lineTo(cx + 25, cy + 20);
                this.ctx.closePath();
                this.ctx.fill();

                const mouthOpen = musicEngine.bass * 40;
                this.ctx.beginPath();
                this.ctx.moveTo(cx - 220, cy + 60);
                this.ctx.quadraticCurveTo(cx, cy + 180 + mouthOpen, cx + 220, cy + 60);
                this.ctx.lineTo(cx + 170, cy + 80);
                this.ctx.lineTo(cx + 130, cy + 50);
                this.ctx.lineTo(cx + 90, cy + 90);
                this.ctx.lineTo(cx + 40, cy + 50);
                this.ctx.lineTo(cx, cy + 90);
                this.ctx.lineTo(cx - 40, cy + 50);
                this.ctx.lineTo(cx - 90, cy + 90);
                this.ctx.lineTo(cx - 130, cy + 50);
                this.ctx.lineTo(cx - 170, cy + 80);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.shadowBlur = 0;
            }

            // 2. Christmas
            renderChristmas() {
                const w = this.width;
                const h = this.height;

                const grad = this.ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w/2);
                grad.addColorStop(0, '#a8071a');
                grad.addColorStop(0.7, '#6b000b');
                grad.addColorStop(1, '#002c11');
                this.ctx.fillStyle = grad;
                this.ctx.fillRect(0, 0, w, h);

                this.ctx.fillStyle = '#0f5132';
                for (let x = -w; x < w * 2; x += 120) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x + Math.sin(this.time + x) * 20, 0);
                    this.ctx.lineTo(x + 60 + Math.sin(this.time + x) * 20, 0);
                    this.ctx.lineTo(x - 100, h);
                    this.ctx.lineTo(x - 160, h);
                    this.ctx.fill();
                }

                const colors = ['#ff4d4f', '#52c41a', '#ffec3d', '#1890ff', '#ffffff'];
                for (let i = 0; i < 40; i++) {
                    const lx = (i * 55 + this.time * 20) % w;
                    const ly = 100 + Math.sin(i + this.time * 2) * 80;
                    const flash = Math.sin(this.time * 6 + i) > 0 || musicEngine.beatHit;
                    this.ctx.fillStyle = flash ? colors[i % colors.length] : '#333';
                    this.ctx.shadowColor = colors[i % colors.length];
                    this.ctx.shadowBlur = flash ? 25 : 0;
                    this.ctx.beginPath();
                    this.ctx.arc(lx, ly, 10 + musicEngine.bass * 5, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.shadowBlur = 0;

                const snowSpeed = 1 + musicEngine.average * 3;
                this.ctx.fillStyle = '#ffffff';
                this.snowflakes.forEach(s => {
                    s.y += s.s * snowSpeed;
                    s.x += Math.sin(this.time + s.y * 0.05) * 0.5;
                    if (s.y > h) s.y = -10;
                    if (s.x > w) s.x = 0;
                    if (s.x < 0) s.x = w;

                    this.ctx.beginPath();
                    this.ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                this.ctx.font = '900 48px Orbitron, sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = '#52c41a';
                this.ctx.shadowBlur = 20 + musicEngine.bass * 30;
                this.ctx.fillText("MERRY CHRISTMAS", w * 0.5, h * 0.55);
                this.ctx.shadowBlur = 0;
            }

            // 3. New Year Fireworks
            renderFireworks() {
                const w = this.width;
                const h = this.height;

                this.ctx.fillStyle = 'rgba(5, 5, 16, 0.25)';
                this.ctx.fillRect(0, 0, w, h);

                // Auto launch or music beat launch
                if (Math.random() < 0.1 || (musicEngine.beatHit && Math.random() < 0.7)) {
                    const fx = Math.random() * w;
                    const fy = 100 + Math.random() * (h * 0.5);
                    const color = ['#ff0055', '#00f0ff', '#ffea00', '#52c41a', '#ff9900'][Math.floor(Math.random() * 5)];
                    
                    audioEngine.playFireworkPop();

                    const particleCount = musicEngine.isPlaying ? Math.floor(40 + musicEngine.bass * 40) : 40;
                    for (let p = 0; p < particleCount; p++) {
                        const angle = (Math.PI * 2 / particleCount) * p;
                        const speed = Math.random() * 6 + 2 + musicEngine.bass * 4;
                        this.fireworks.push({
                            x: fx,
                            y: fy,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            color: color,
                            alpha: 1.0,
                            life: Math.random() * 30 + 30
                        });
                    }
                }

                for (let i = this.fireworks.length - 1; i >= 0; i--) {
                    const p = this.fireworks[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.08;
                    p.alpha -= 0.02;

                    if (p.alpha <= 0) {
                        this.fireworks.splice(i, 1);
                        continue;
                    }

                    this.ctx.fillStyle = p.color;
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.shadowColor = p.color;
                    this.ctx.shadowBlur = 10;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.globalAlpha = 1.0;
                this.ctx.shadowBlur = 0;

                const textScale = Math.sin(this.time * 4) * 5 + 56 + (musicEngine.bass * 15);
                this.ctx.font = `900 ${textScale}px Orbitron, sans-serif`;
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffea00';
                this.ctx.shadowColor = '#ff0055';
                this.ctx.shadowBlur = 30 + musicEngine.bass * 20;
                this.ctx.fillText("HAPPY NEW YEAR", w * 0.5, h * 0.48);
                
                this.ctx.font = '900 64px Orbitron, sans-serif';
                this.ctx.fillStyle = '#00f0ff';
                this.ctx.fillText("2027", w * 0.5, h * 0.65);
                this.ctx.shadowBlur = 0;
            }

            // 4. Mid-Autumn Festival
            renderMidAutumn() {
                const w = this.width;
                const h = this.height;

                const bgGrad = this.ctx.createLinearGradient(0, 0, 0, h);
                bgGrad.addColorStop(0, '#020514');
                bgGrad.addColorStop(0.6, '#0b193c');
                bgGrad.addColorStop(1, '#1b0f38');
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, w, h);

                const cx = w * 0.5;
                const cy = h * 0.42;

                const moonRadius = 130 + (musicEngine.bass * 25);
                const moonGrad = this.ctx.createRadialGradient(cx, cy, 20, cx, cy, moonRadius);
                moonGrad.addColorStop(0, '#ffffff');
                moonGrad.addColorStop(0.5, '#ffe600');
                moonGrad.addColorStop(1, '#ffaa00');
                
                this.ctx.shadowColor = '#ffea00';
                this.ctx.shadowBlur = 50 + (musicEngine.treble * 40);
                this.ctx.fillStyle = moonGrad;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, moonRadius, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;

                this.ctx.fillStyle = 'rgba(255, 235, 170, 0.2)';
                for (let i = 0; i < 3; i++) {
                    const cloudX = (cx - 200 + i * 180 + Math.sin(this.time + i) * 40) % w;
                    this.ctx.beginPath();
                    this.ctx.ellipse(cloudX, cy + 30 * i - 20, 140, 25, 0, 0, Math.PI * 2);
                    this.ctx.fill();
                }

                const hopMult = musicEngine.isPlaying ? 4 + musicEngine.bass * 8 : 4;
                const rx = cx + Math.sin(this.time * 2) * 60;
                const ry = cy + 40 - Math.abs(Math.cos(this.time * hopMult)) * (25 + musicEngine.bass * 30);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.beginPath();
                this.ctx.arc(rx, ry, 18, 0, Math.PI * 2);
                this.ctx.arc(rx + 12, ry - 14, 11, 0, Math.PI * 2);
                this.ctx.ellipse(rx + 10, ry - 30, 4, 12, -0.2, 0, Math.PI * 2);
                this.ctx.ellipse(rx + 17, ry - 28, 4, 12, 0.2, 0, Math.PI * 2);
                this.ctx.arc(rx - 16, ry + 8, 5, 0, Math.PI * 2);
                this.ctx.fill();

                this.ctx.font = '900 44px Orbitron, sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffeaa7';
                this.ctx.shadowColor = '#fdcb6e';
                this.ctx.shadowBlur = 15;
                this.ctx.fillText("HAPPY MID-AUTUMN", cx, h * 0.82);
                this.ctx.shadowBlur = 0;
            }

            // 5. Valentine's Day
            renderValentine() {
                const w = this.width;
                const h = this.height;

                const bgGrad = this.ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w/2);
                bgGrad.addColorStop(0, '#590925');
                bgGrad.addColorStop(0.7, '#2b0515');
                bgGrad.addColorStop(1, '#120008');
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, w, h);

                const speedMult = 1 + musicEngine.average * 2;
                this.hearts.forEach(hItem => {
                    hItem.y -= hItem.speed * speedMult;
                    if (hItem.y < -30) hItem.y = h + 20;

                    this.drawHeart(hItem.x + Math.sin(this.time + hItem.y * 0.02) * 15, hItem.y, hItem.size, '#ff4d6d', hItem.opacity);
                });

                const scale = 1 + Math.sin(this.time * 4) * 0.08 + (musicEngine.bass * 0.25);
                const cx = w * 0.5;
                const cy = h * 0.45;
                this.drawHeart(cx, cy, 120 * scale, '#ff0054', 1.0, true);

                this.ctx.font = '900 48px Orbitron, sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = '#ff0054';
                this.ctx.shadowBlur = 25 + musicEngine.bass * 25;
                this.ctx.fillText("BE MY VALENTINE", cx, h * 0.82);
                this.ctx.shadowBlur = 0;
            }

            drawHeart(x, y, size, color, alpha = 1.0, glow = false) {
                this.ctx.save();
                this.ctx.translate(x, y);
                this.ctx.globalAlpha = alpha;
                if (glow) {
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = 30 + musicEngine.bass * 30;
                }
                this.ctx.fillStyle = color;
                this.ctx.beginPath();
                const d = size;
                this.ctx.moveTo(0, 0);
                this.ctx.bezierCurveTo(-d / 2, -d / 2, -d, d / 3, 0, d);
                this.ctx.bezierCurveTo(d, d / 3, d / 2, -d / 2, 0, 0);
                this.ctx.fill();
                this.ctx.restore();
            }

            // 6. Lantern Festival
            renderLanternFest() {
                const w = this.width;
                const h = this.height;

                this.ctx.fillStyle = '#0a0204';
                this.ctx.fillRect(0, 0, w, h);

                const speedMult = 1 + musicEngine.mid * 2;
                this.lanterns.forEach(l => {
                    l.y -= l.speed * speedMult;
                    if (l.y < -60) l.y = h + 40;

                    const lx = l.x + Math.sin(this.time * 1.5 + l.y) * 20;
                    const ly = l.y;
                    const s = l.scale * (1 + musicEngine.bass * 0.3);

                    this.ctx.shadowColor = '#ff0000';
                    this.ctx.shadowBlur = 25 * s;
                    this.ctx.fillStyle = '#d90429';
                    this.ctx.beginPath();
                    this.ctx.ellipse(lx, ly, 25 * s, 32 * s, 0, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.shadowBlur = 0;

                    this.ctx.fillStyle = '#ffb703';
                    this.ctx.fillRect(lx - 15 * s, ly - 36 * s, 30 * s, 6 * s);
                    this.ctx.fillRect(lx - 15 * s, ly + 30 * s, 30 * s, 6 * s);

                    this.ctx.strokeStyle = '#ffb703';
                    this.ctx.lineWidth = 2 * s;
                    this.ctx.beginPath();
                    this.ctx.moveTo(lx, ly + 36 * s);
                    this.ctx.lineTo(lx, ly + 55 * s);
                    this.ctx.stroke();
                });

                this.ctx.font = '900 50px Orbitron, sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillStyle = '#ffb703';
                this.ctx.shadowColor = '#d90429';
                this.ctx.shadowBlur = 25;
                this.ctx.fillText("LANTERN FESTIVAL", w * 0.5, h * 0.52);
                this.ctx.shadowBlur = 0;
            }

            // 7. Cyberpunk Digital Eye
            renderCyberpunk() {
                const w = this.width;
                const h = this.height;

                this.ctx.fillStyle = '#030712';
                this.ctx.fillRect(0, 0, w, h);

                const cx = w * 0.5;
                const cy = h * 0.5;

                const ringExpand = musicEngine.bass * 40;
                for (let i = 1; i <= 4; i++) {
                    this.ctx.strokeStyle = i % 2 === 0 ? '#00f0ff' : '#ff0077';
                    this.ctx.lineWidth = 2 + musicEngine.treble * 4;
                    this.ctx.beginPath();
                    this.ctx.arc(cx, cy, i * 60 + Math.sin(this.time * 2) * 5 + ringExpand * (i * 0.3), 0, Math.PI * 2);
                    this.ctx.stroke();
                }

                this.ctx.save();
                this.ctx.translate(cx, cy);
                this.ctx.rotate(this.time * (0.8 + musicEngine.mid * 2));
                this.ctx.strokeStyle = '#00f0ff';
                this.ctx.lineWidth = 6;
                this.ctx.setLineDash([40, 20, 10, 20]);
                this.ctx.beginPath();
                this.ctx.arc(0, 0, 180 + musicEngine.bass * 20, 0, Math.PI * 2);
                this.ctx.stroke();
                this.ctx.restore();

                const irisGrad = this.ctx.createRadialGradient(cx, cy, 20, cx, cy, 120);
                irisGrad.addColorStop(0, '#000000');
                irisGrad.addColorStop(0.3, '#ff0055');
                irisGrad.addColorStop(0.7, '#00f0ff');
                irisGrad.addColorStop(1, '#000000');
                
                this.ctx.fillStyle = irisGrad;
                this.ctx.beginPath();
                this.ctx.arc(cx, cy, 120 + musicEngine.bass * 15, 0, Math.PI * 2);
                this.ctx.fill();

                const pupilX = cx + Math.sin(this.time * 2.5) * (40 + musicEngine.treble * 30);
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = '#00f0ff';
                this.ctx.shadowBlur = 30 + musicEngine.bass * 30;
                this.ctx.beginPath();
                this.ctx.arc(pupilX, cy, 35 + musicEngine.bass * 10, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.shadowBlur = 0;
            }

            // 8. EMOJI PACK
            render10EmojiPack() {
                if (this.activeEmoji === 'custom') { this.renderCustomEmoji(); return; }
                const w = this.width;
                const h = this.height;
                const cx = w * 0.5;
                const cy = h * 0.5;

                let baseColor1 = '#ffe600';
                let baseColor2 = '#d48800';

                if (this.activeEmoji === 'angry') {
                    baseColor1 = '#ff4d4f';
                    baseColor2 = '#9e1000';
                } else if (this.activeEmoji === 'sleepy') {
                    baseColor1 = '#adc6ff';
                    baseColor2 = '#2f54eb';
                }

                const bgGrad = this.ctx.createRadialGradient(cx, cy, 100, cx, cy, h);
                bgGrad.addColorStop(0, baseColor1);
                bgGrad.addColorStop(1, baseColor2);
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, w, h);

                this.ctx.fillStyle = '#222222';
                this.ctx.strokeStyle = '#222222';

                const beatScale = 1 + musicEngine.bass * 0.15;

                switch (this.activeEmoji) {
                    case 'happy':
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130 * beatScale, cy - 40, 35 * beatScale, 0, Math.PI * 2);
                        this.ctx.arc(cx + 130 * beatScale, cy - 40, 35 * beatScale, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.lineWidth = 14 * beatScale;
                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 20, 110 * beatScale, 0.1 * Math.PI, 0.9 * Math.PI);
                        this.ctx.stroke();

                        this.ctx.fillStyle = 'rgba(255, 77, 79, 0.4)';
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 170, cy + 30, 30, 0, Math.PI * 2);
                        this.ctx.arc(cx + 170, cy + 30, 30, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;

                    case 'cool':
                        this.ctx.fillStyle = '#111111';
                        this.ctx.beginPath();
                        this.ctx.roundRect(cx - 210 * beatScale, cy - 90, 180 * beatScale, 95, 20);
                        this.ctx.roundRect(cx + 30, cy - 90, 180 * beatScale, 95, 20);
                        this.ctx.fill();
                        this.ctx.fillRect(cx - 30, cy - 60, 60, 15);

                        this.ctx.strokeStyle = '#ffffff';
                        this.ctx.lineWidth = 6;
                        this.ctx.beginPath();
                        this.ctx.moveTo(cx - 190, cy - 70);
                        this.ctx.lineTo(cx - 120, cy - 20);
                        this.ctx.moveTo(cx + 50, cy - 70);
                        this.ctx.lineTo(cx + 120, cy - 20);
                        this.ctx.stroke();

                        this.ctx.lineWidth = 12;
                        this.ctx.beginPath();
                        this.ctx.arc(cx + 20, cy + 30, 100, 0.1 * Math.PI, 0.6 * Math.PI);
                        this.ctx.stroke();
                        break;

                    case 'wink':
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130, cy - 50, 35 * beatScale, 0, Math.PI * 2);
                        this.ctx.fill();
                        
                        this.ctx.lineWidth = 14;
                        this.ctx.beginPath();
                        this.ctx.arc(cx + 130, cy - 50, 35, 0.8 * Math.PI, 0.2 * Math.PI);
                        this.ctx.stroke();

                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 30, 120, 0, Math.PI, false);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#ff4d4f';
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 30, cy + 130 + (musicEngine.bass * 20), 45 * beatScale, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;

                    case 'heart_eyes':
                        const pulse = Math.sin(this.time * 6) * 10 + 55 + (musicEngine.bass * 30);
                        this.drawHeart(cx - 130, cy - 50, pulse, '#ff0054', true);
                        this.drawHeart(cx + 130, cy - 50, pulse, '#ff0054', true);

                        this.ctx.lineWidth = 14;
                        this.ctx.fillStyle = '#222';
                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 30, 110, 0, Math.PI);
                        this.ctx.fill();
                        break;

                    case 'cry_laugh':
                        this.ctx.lineWidth = 14;
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130, cy - 50, 35, 0.8 * Math.PI, 0.2 * Math.PI);
                        this.ctx.arc(cx + 130, cy - 50, 35, 0.8 * Math.PI, 0.2 * Math.PI);
                        this.ctx.stroke();

                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 20, 120, 0, Math.PI);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#00f0ff';
                        this.ctx.shadowColor = '#00f0ff';
                        this.ctx.shadowBlur = 15;
                        const tearY = (this.time * (200 + musicEngine.average * 200)) % 150 + cy - 30;
                        this.ctx.beginPath();
                        this.ctx.ellipse(cx - 200, tearY, 20, 35, -0.2, 0, Math.PI * 2);
                        this.ctx.ellipse(cx + 200, tearY, 20, 35, 0.2, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.shadowBlur = 0;
                        break;

                    case 'thinking':
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 110, cy - 60, 35, 0, Math.PI * 2);
                        this.ctx.arc(cx + 130, cy - 60, 35, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.fillStyle = '#fff';
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 100, cy - 75, 12, 0, Math.PI * 2);
                        this.ctx.arc(cx + 140, cy - 75, 12, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.lineWidth = 12;
                        this.ctx.beginPath();
                        this.ctx.moveTo(cx - 60, cy + 80);
                        this.ctx.lineTo(cx + 60, cy + 60);
                        this.ctx.stroke();

                        this.ctx.fillStyle = '#ffb700';
                        this.ctx.beginPath();
                        this.ctx.ellipse(cx - 40, cy + 130, 40, 25, -0.2, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;

                    case 'shocked':
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130, cy - 60, 45 + musicEngine.bass * 15, 0, Math.PI * 2);
                        this.ctx.arc(cx + 130, cy - 60, 45 + musicEngine.bass * 15, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.beginPath();
                        this.ctx.ellipse(cx, cy + 70, 50 + musicEngine.bass * 20, 75 + musicEngine.bass * 30, 0, 0, Math.PI * 2);
                        this.ctx.fill();
                        break;

                    case 'angry':
                        this.ctx.lineWidth = 18;
                        this.ctx.beginPath();
                        this.ctx.moveTo(cx - 200, cy - 120);
                        this.ctx.lineTo(cx - 70, cy - 60);
                        this.ctx.moveTo(cx + 200, cy - 120);
                        this.ctx.lineTo(cx + 70, cy - 60);
                        this.ctx.stroke();

                        this.ctx.beginPath();
                        this.ctx.arc(cx - 120, cy - 40, 30, 0, Math.PI * 2);
                        this.ctx.arc(cx + 120, cy - 40, 30, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 120, 100, 1.1 * Math.PI, 1.9 * Math.PI);
                        this.ctx.stroke();
                        break;

                    case 'sleepy':
                        this.ctx.lineWidth = 12;
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130, cy - 30, 40, 0.1 * Math.PI, 0.9 * Math.PI);
                        this.ctx.arc(cx + 130, cy - 30, 40, 0.1 * Math.PI, 0.9 * Math.PI);
                        this.ctx.stroke();

                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy + 60, 30 + musicEngine.bass * 15, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.font = '900 48px Orbitron, sans-serif';
                        this.ctx.fillStyle = '#ffffff';
                        const zY = (this.time * 60) % 120;
                        this.ctx.fillText("Z Z z", cx + 180, cy - 80 - zY);
                        break;

                    case 'mindblown':
                        this.ctx.beginPath();
                        this.ctx.arc(cx - 130, cy - 10, 40, 0, Math.PI * 2);
                        this.ctx.arc(cx + 130, cy - 10, 40, 0, Math.PI * 2);
                        this.ctx.fill();

                        this.ctx.beginPath();
                        this.ctx.ellipse(cx, cy + 100, 60, 40, 0, 0, Math.PI * 2);
                        this.ctx.fill();

                        for (let i = 0; i < 20; i++) {
                            const expAngle = (Math.PI / 20) * i + Math.PI;
                            const expDist = 180 + Math.sin(this.time * 8 + i) * 30 + (musicEngine.bass * 50);
                            const px = cx + Math.cos(expAngle) * expDist;
                            const py = cy - 60 + Math.sin(expAngle) * expDist;
                            
                            this.ctx.fillStyle = ['#ff0055', '#00f0ff', '#ffea00'][i % 3];
                            this.ctx.shadowColor = '#ffea00';
                            this.ctx.shadowBlur = 15 + musicEngine.bass * 20;
                            this.ctx.beginPath();
                            this.ctx.arc(px, py, 25, 0, Math.PI * 2);
                            this.ctx.fill();
                        }
                        this.ctx.shadowBlur = 0;
                        break;
                }
            }

            // 9. Realistic Earth
            renderEarth() {
                const w = this.width;
                const h = this.height;

                this.ctx.fillStyle = '#04152d';
                this.ctx.fillRect(0, 0, w, h);

                const offset = (this.time * 30) % w;
                this.ctx.fillStyle = '#1b4d2e';

                for (let i = -1; i <= 2; i++) {
                    const baseX = i * w + offset;

                    this.ctx.beginPath();
                    this.ctx.moveTo(baseX + 100, 100);
                    this.ctx.quadraticCurveTo(baseX + 250, 120, baseX + 280, 250);
                    this.ctx.quadraticCurveTo(baseX + 200, 320, baseX + 120, 260);
                    this.ctx.closePath();
                    this.ctx.fill();

                    this.ctx.beginPath();
                    this.ctx.moveTo(baseX + 500, 120);
                    this.ctx.quadraticCurveTo(baseX + 750, 100, baseX + 850, 240);
                    this.ctx.quadraticCurveTo(baseX + 650, 340, baseX + 520, 260);
                    this.ctx.closePath();
                    this.ctx.fill();
                }

                this.ctx.fillStyle = '#ffc107';
                for (let j = 0; j < 80; j++) {
                    const lx = ((j * 47) + offset) % w;
                    const ly = 120 + Math.sin(j * 3) * 140;
                    this.ctx.fillRect(lx, ly, 3, 3);
                }

                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                for (let c = -1; c <= 2; c++) {
                    const cx = c * w + offset * 1.3;
                    this.ctx.beginPath();
                    this.ctx.ellipse(cx + 300, 180, 160, 25, 0.2, 0, Math.PI * 2);
                    this.ctx.ellipse(cx + 700, 320, 200, 30, -0.1, 0, Math.PI * 2);
                    this.ctx.fill();
                }
            }

            // 11. WORLD LANDMARKS
            renderLandmarks() {
                const ctx = this.ctx, w = this.width, h = this.height, t = this.time;
                const L = LANDMARKS[this.landmarkIndex];
                const GY = 410;

                const sky = ctx.createLinearGradient(0, 0, 0, GY);
                sky.addColorStop(0, L.sky[0]); sky.addColorStop(0.6, L.sky[1]); sky.addColorStop(1, L.sky[2]);
                ctx.fillStyle = sky; ctx.fillRect(0, 0, w, GY);

                if (L.stars) {
                    for (let i = 0; i < 110; i++) {
                        const x = (i * 127.3) % w, y = (i * 53.7) % (GY * 0.7);
                        const tw = 0.5 + 0.5 * Math.sin(t * 2 + i) + (musicEngine.treble * 0.4);
                        ctx.fillStyle = `rgba(255,255,255,${Math.min(1, 0.15 + 0.6 * tw)})`;
                        ctx.fillRect(x, y, i % 7 === 0 ? 2.5 : 1.6, i % 7 === 0 ? 2.5 : 1.6);
                    }
                }

                const [sx, sy, sr, sc] = L.sun;
                const dynamicSunRadius = sr * (1 + musicEngine.bass * 0.2);
                const sg = ctx.createRadialGradient(sx, sy, dynamicSunRadius * 0.3, sx, sy, dynamicSunRadius * 3.2);
                sg.addColorStop(0, sc); sg.addColorStop(0.3, sc + '66'); sg.addColorStop(1, sc + '00');
                ctx.fillStyle = sg; ctx.fillRect(sx - dynamicSunRadius * 3.2, sy - dynamicSunRadius * 3.2, dynamicSunRadius * 6.4, dynamicSunRadius * 6.4);
                ctx.fillStyle = sc; ctx.beginPath(); ctx.arc(sx, sy, dynamicSunRadius, 0, Math.PI * 2); ctx.fill();

                const hg = ctx.createRadialGradient(w / 2, GY - 150, 10, w / 2, GY - 150, 300);
                hg.addColorStop(0, L.glow + '55'); hg.addColorStop(1, L.glow + '00');
                ctx.fillStyle = hg; ctx.fillRect(0, 0, w, h);

                const gr = ctx.createLinearGradient(0, GY, 0, h);
                gr.addColorStop(0, L.ground[0]); gr.addColorStop(1, L.ground[1]);
                ctx.fillStyle = gr; ctx.fillRect(0, GY, w, h - GY);

                ctx.save();
                ctx.translate(w * 0.5, GY);
                ctx.scale(L.scale, L.scale);
                L.draw(ctx, t);
                ctx.restore();
            }

            // 12. CUSTOM EMOJI
            getEmojiList(text) {
                if (this._emojiKey === text) return this._emojiList;
                let arr;
                try {
                    arr = Intl.Segmenter
                        ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text)).map(s => s.segment)
                        : Array.from(text);
                } catch (e) { arr = Array.from(text); }
                arr = arr.filter(s => s.trim()).slice(0, 12);
                if (!arr.length) arr = ['🙂'];
                this._emojiKey = text;
                this._emojiList = arr;
                return arr;
            }

            shadeHex(hex, f) {
                const n = parseInt(hex.slice(1), 16);
                const c = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
                return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
            }

            renderCustomEmoji() {
                const ctx = this.ctx, w = this.width, h = this.height, t = this.time;
                const ce = this.customEmoji;
                const list = this.getEmojiList(ce.text);

                const bg = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, h * 1.1);
                bg.addColorStop(0, this.shadeHex(ce.bg, 1.7));
                bg.addColorStop(1, this.shadeHex(ce.bg, 0.3));
                ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

                for (let i = 0; i < 40; i++) {
                    const x = (i * 97.3 + t * 12 * (1 + (i % 3))) % w;
                    const y = (h - ((i * 61.7 + t * 25) % h));
                    ctx.fillStyle = `rgba(255,255,255,${0.1 + 0.25 * Math.abs(Math.sin(t + i))})`;
                    ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
                }

                const fam = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

                if (ce.mode === 'single') {
                    const em = list[Math.floor(t / 1.8) % list.length];
                    ctx.save();
                    ctx.translate(w / 2, h / 2 + Math.sin(t * 2) * 14);
                    const sc = (1 + 0.06 * Math.sin(t * 3)) * (1 + musicEngine.bass * 0.25);
                    ctx.scale(sc, sc);
                    ctx.font = `${ce.size}px ${fam}`;
                    ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
                    ctx.fillText(em, 0, 0);
                    ctx.restore();
                } else {
                    const cols = 4, rows = 3;
                    const cw = w / cols, ch = h / rows;
                    const size = Math.min(ch * 0.78, ce.size * 0.6) * (1 + musicEngine.bass * 0.15);
                    ctx.font = `${size}px ${fam}`;
                    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 14;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const i = r * cols + c;
                            const x = ((c + 0.5) * cw + (r % 2 ? cw / 2 : 0) + t * 10) % w;
                            const y = (r + 0.5) * ch + Math.sin(t * 2 + i) * 10;
                            ctx.fillText(list[i % list.length], x, y);
                        }
                    }
                    ctx.shadowBlur = 0;
                }
                ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
            }

            // 10. Custom User Configured Facade Engine
            renderCustom() {
                const w = this.width;
                const h = this.height;

                this.ctx.fillStyle = '#050714';
                this.ctx.fillRect(0, 0, w, h);

                const c1 = this.params.color1;
                const c2 = this.params.color2;

                if (this.params.mode === 'matrix') {
                    const cols = 32;
                    const cellW = w / cols;
                    for (let x = 0; x < cols; x++) {
                        for (let y = 0; y < 16; y++) {
                            const val = Math.sin(x * 0.5 + y * 0.5 + this.time * 3) + (musicEngine.bass * 0.8);
                            this.ctx.fillStyle = val > 0 ? c1 : c2;
                            this.ctx.fillRect(x * cellW + 2, y * 32 + 2, cellW - 4, 28);
                        }
                    }
                } else if (this.params.mode === 'waves') {
                    for (let x = 0; x < w; x += 10) {
                        const waveY = h/2 + Math.sin(x * 0.01 + this.time * 3) * (100 + musicEngine.bass * 60) + Math.cos(x * 0.02 - this.time * 2) * 50;
                        const grad = this.ctx.createLinearGradient(x, 0, x, h);
                        grad.addColorStop(0, c1);
                        grad.addColorStop(1, c2);
                        this.ctx.fillStyle = grad;
                        this.ctx.fillRect(x, waveY - 20, 8, 40);
                    }
                } else if (this.params.mode === 'text') {
                    const textFont = 52 + (musicEngine.bass * 20);
                    this.ctx.font = `900 ${textFont}px Orbitron, sans-serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillStyle = c1;
                    this.ctx.shadowColor = c2;
                    this.ctx.shadowBlur = 25 + musicEngine.treble * 25;
                    
                    const scrollX = w * 0.5 + Math.sin(this.time * 2) * 150;
                    this.ctx.fillText(this.params.text.toUpperCase(), scrollX, h * 0.55);
                    this.ctx.shadowBlur = 0;
                } else if (this.params.mode === 'rings') {
                    const cx = w * 0.5;
                    const cy = h * 0.5;
                    for (let r = 20; r < 300; r += 40) {
                        const radius = (r + this.time * (80 + musicEngine.average * 100)) % 300;
                        this.ctx.strokeStyle = r % 80 === 0 ? c1 : c2;
                        this.ctx.lineWidth = 12 + musicEngine.bass * 10;
                        this.ctx.beginPath();
                        this.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        this.ctx.stroke();
                    }
                }
            }
        }

        // --- 3. Three.js 3D Sphere Scene ---
        class VegasSphereScene {
            constructor() {
                this.container = document.getElementById('webgl-container');
                this.facadeGen = new FacadeTextureGenerator('texture-canvas');

                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x030308, 0.0035);

                this.camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 18, 65);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                this.container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.maxPolarAngle = Math.PI / 2 - 0.01;
                this.controls.minDistance = 25;
                this.controls.maxDistance = 150;
                this.controls.autoRotate = true;
                this.controls.autoRotateSpeed = 0.8;

                this.clock = new THREE.Clock();
                this.baseSphereRadius = 18;

                this.initLights();
                this.initSphere();
                this.initEnvironment();
                this.bindEvents();

                this.animate();
            }

            initLights() {
                const ambientLight = new THREE.AmbientLight(0x0d111e, 1.2);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0x223355, 1.5);
                dirLight.position.set(50, 80, 40);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                this.scene.add(dirLight);

                this.spherePointLight = new THREE.PointLight(0x00f0ff, 3.5, 120);
                this.spherePointLight.position.set(0, 15, 0);
                this.scene.add(this.spherePointLight);
            }

            initSphere() {
                this.facadeTexture = new THREE.CanvasTexture(this.facadeGen.canvas);
                this.facadeTexture.minFilter = THREE.LinearFilter;
                this.facadeTexture.magFilter = THREE.LinearFilter;
                this.facadeTexture.wrapS = THREE.RepeatWrapping;
                this.facadeTexture.wrapT = THREE.ClampToEdgeWrapping;

                const geometry = new THREE.SphereGeometry(this.baseSphereRadius, 64, 64);

                this.sphereMaterial = new THREE.MeshStandardMaterial({
                    map: this.facadeTexture,
                    emissiveMap: this.facadeTexture,
                    emissive: new THREE.Color(0xffffff),
                    emissiveIntensity: 1.5,
                    roughness: 0.2,
                    metalness: 0.8
                });

                this.sphereMesh = new THREE.Mesh(geometry, this.sphereMaterial);
                this.sphereMesh.position.set(0, 15, 0);
                this.sphereMesh.castShadow = true;
                this.sphereMesh.receiveShadow = true;
                this.scene.add(this.sphereMesh);

                const glowGeo = new THREE.SphereGeometry(18.6, 32, 32);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0x00f0ff,
                    transparent: true,
                    opacity: 0.12,
                    side: THREE.BackSide
                });
                this.glowMesh = new THREE.Mesh(glowGeo, glowMat);
                this.sphereMesh.add(this.glowMesh);
            }

            initEnvironment() {
                const groundGeo = new THREE.PlaneGeometry(300, 300);
                const groundMat = new THREE.MeshStandardMaterial({
                    color: 0x0a0d14,
                    roughness: 0.1,
                    metalness: 0.6
                });
                this.ground = new THREE.Mesh(groundGeo, groundMat);
                this.ground.rotation.x = -Math.PI / 2;
                this.ground.position.y = -3;
                this.ground.receiveShadow = true;
                this.scene.add(this.ground);

                this.grid = new THREE.GridHelper(300, 40, 0x06b6d4, 0x1e293b);
                this.grid.position.y = -2.9;
                this.scene.add(this.grid);

                const buildingGroup = new THREE.Group();
                const bldgGeo = new THREE.BoxGeometry(1, 1, 1);
                
                for (let i = 0; i < 45; i++) {
                    const angle = (i / 45) * Math.PI * 2;
                    const radius = 90 + Math.random() * 50;

                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;

                    const height = 20 + Math.random() * 65;
                    const width = 12 + Math.random() * 16;
                    const depth = 12 + Math.random() * 16;

                    const bldgMat = new THREE.MeshStandardMaterial({
                        color: 0x060913,
                        roughness: 0.4,
                        metalness: 0.8
                    });

                    const building = new THREE.Mesh(bldgGeo, bldgMat);
                    building.scale.set(width, height, depth);
                    building.position.set(x, height / 2 - 3, z);
                    buildingGroup.add(building);

                    if (Math.random() > 0.4) {
                        const neonGeo = new THREE.BoxGeometry(width + 0.2, 1, depth + 0.2);
                        const neonMat = new THREE.MeshBasicMaterial({
                            color: [0x00f0ff, 0xff00a0, 0x7000ff, 0xffea00][Math.floor(Math.random() * 4)]
                        });
                        const neon = new THREE.Mesh(neonGeo, neonMat);
                        neon.position.set(x, height - 2, z);
                        buildingGroup.add(neon);
                    }
                }
                this.scene.add(buildingGroup);

                const starsGeo = new THREE.BufferGeometry();
                const count = 1200;
                const positions = new Float32Array(count * 3);

                for (let i = 0; i < count * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 500;
                    positions[i + 1] = Math.random() * 200 + 20;
                    positions[i + 2] = (Math.random() - 0.5) * 500;
                }

                starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const starsMat = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.8,
                    transparent: true,
                    opacity: 0.7
                });
                const starField = new THREE.Points(starsGeo, starsMat);
                this.scene.add(starField);
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const delta = this.clock.getDelta();

                // Update Music Rhythm Engine
                musicEngine.update();

                // Dynamic Music Rhythm Effect on 3D Sphere & Scene
                if (musicEngine.isPlaying) {
                    // 1. Sphere Bounce & Scale Expansion
                    const bassScale = 1 + (musicEngine.bass * 0.22);
                    const beatBounce = musicEngine.beatHit ? 1.5 : 0;
                    
                    // Smooth scaling damping
                    this.sphereMesh.scale.set(bassScale, bassScale, bassScale);
                    this.sphereMesh.position.y = 15 + (musicEngine.bass * 4) + beatBounce;

                    // 2. Light Emission Pulse
                    this.sphereMaterial.emissiveIntensity = this.facadeGen.params.intensity + (musicEngine.bass * 1.8);
                    this.spherePointLight.intensity = 3.5 + (musicEngine.bass * 6);

                    // 3. Camera subtle shake on heavy beat
                    if (musicEngine.beatHit) {
                        this.camera.position.x += (Math.random() - 0.5) * 0.4;
                        this.camera.position.y += (Math.random() - 0.5) * 0.4;
                    }
                } else {
                    // Reset smoothly to normal scale
                    this.sphereMesh.scale.set(1, 1, 1);
                    this.sphereMesh.position.y = 15;
                    this.sphereMaterial.emissiveIntensity = this.facadeGen.params.intensity;
                    this.spherePointLight.intensity = 3.5;
                }

                this.facadeGen.update(delta);
                this.facadeTexture.needsUpdate = true;
                
                // Color synchronization
                const preset = this.facadeGen.currentPreset;
                if (preset === 'halloween') {
                    this.spherePointLight.color.setHex(0xff5500);
                    this.glowMesh.material.color.setHex(0xff5500);
                } else if (preset === 'christmas') {
                    this.spherePointLight.color.setHex(0x52c41a);
                    this.glowMesh.material.color.setHex(0x52c41a);
                } else if (preset === 'mid_autumn') {
                    this.spherePointLight.color.setHex(0xffea00);
                    this.glowMesh.material.color.setHex(0xffea00);
                } else if (preset === 'valentine') {
                    this.spherePointLight.color.setHex(0xff0054);
                    this.glowMesh.material.color.setHex(0xff0054);
                } else if (preset === 'lantern') {
                    this.spherePointLight.color.setHex(0xd90429);
                    this.glowMesh.material.color.setHex(0xd90429);
                } else if (preset === 'landmarks') {
                    const gc = LANDMARKS[this.facadeGen.landmarkIndex].glow;
                    this.spherePointLight.color.setStyle(gc);
                    this.glowMesh.material.color.setStyle(gc);
                } else if (preset === 'emoji') {
                    this.spherePointLight.color.setHex(0xffea00);
                    this.glowMesh.material.color.setHex(0xffea00);
                } else {
                    this.spherePointLight.color.setStyle(this.facadeGen.params.color1);
                    this.glowMesh.material.color.setStyle(this.facadeGen.params.color1);
                }

                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // --- 4. UI Bindings ---
        window.onload = () => {
            const app = new VegasSphereScene();

            const musicInput = document.getElementById('music-input');
            const btnPlayPause = document.getElementById('btn-play-pause');
            const playIcon = document.getElementById('play-icon');
            const trackInfo = document.getElementById('track-info');
            const trackName = document.getElementById('track-name');
            const uploadText = document.getElementById('upload-text');
            const visualizerCanvas = document.getElementById('visualizer-canvas');
            const statusText = document.getElementById('status-text');

            // Handle Music File Upload
            musicInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    trackName.textContent = file.name;
                    uploadText.textContent = "更换音乐";
                    btnPlayPause.classList.remove('hidden');
                    trackInfo.classList.remove('hidden');
                    visualizerCanvas.classList.remove('hidden');
                    statusText.textContent = `🎵 正在播放律动音乐: ${file.name}`;

                    musicEngine.loadTrack(file);
                }
            });

            // Play / Pause Button
            btnPlayPause.addEventListener('click', () => {
                musicEngine.togglePlay();
                if (musicEngine.isPlaying) {
                    statusText.textContent = `🎵 正在播放律动音乐: ${trackName.textContent}`;
                } else {
                    statusText.textContent = `⏸️ 音乐已暂停 - 小球恢复常态`;
                }
            });

            // Music Sensitivity Slider
            const ctrlSensitivity = document.getElementById('ctrl-sensitivity');
            const valSensitivity = document.getElementById('val-rhythm-sensitivity');
            if (ctrlSensitivity) {
                ctrlSensitivity.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    musicEngine.sensitivity = val;
                    valSensitivity.textContent = `${val.toFixed(1)}x`;
                });
            }

            const presetButtons = document.querySelectorAll('.preset-btn');
            const customPanel = document.getElementById('custom-panel');
            const emojiDrawer = document.getElementById('emoji-drawer');
            const emojiSubButtons = document.querySelectorAll('.emoji-sub-btn');
            const landmarkDrawer = document.getElementById('landmark-drawer');
            const landmarkCaption = document.getElementById('landmark-caption');
            const customEmojiRow = document.getElementById('custom-emoji-row');

            presetButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    presetButtons.forEach(b => b.classList.remove('active'));
                    const targetBtn = e.currentTarget;
                    targetBtn.classList.add('active');

                    const presetKey = targetBtn.getAttribute('data-preset');
                    app.facadeGen.currentPreset = presetKey;

                    customPanel.classList.toggle('hidden', presetKey !== 'custom');
                    emojiDrawer.classList.toggle('hidden', presetKey !== 'emoji');
                    landmarkDrawer.classList.toggle('hidden', presetKey !== 'landmarks');
                    landmarkCaption.classList.toggle('hidden', presetKey !== 'landmarks');
                    if (presetKey === 'landmarks') updateCaption(app.facadeGen.landmarkIndex);
                });
            });

            emojiSubButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    emojiSubButtons.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    app.facadeGen.activeEmoji = target.getAttribute('data-emoji');
                    customEmojiRow.classList.toggle('hidden', app.facadeGen.activeEmoji !== 'custom');
                    customEmojiRow.classList.toggle('flex', app.facadeGen.activeEmoji === 'custom');
                });
            });

            const lmBox = document.getElementById('landmark-buttons');
            const lmButtons = [];
            function updateCaption(i) {
                const L = LANDMARKS[i];
                document.getElementById('lm-emoji').textContent = L.emoji;
                document.getElementById('lm-name').textContent = L.name;
                document.getElementById('lm-en').textContent = L.en;
                document.getElementById('lm-place').textContent = L.place;
                document.getElementById('lm-fact').textContent = L.fact;
                document.getElementById('lm-count').textContent = `${i + 1} / ${LANDMARKS.length}`;
                lmButtons.forEach((b, k) => b.classList.toggle('active', k === i));
            }
            LANDMARKS.forEach((L, i) => {
                const b = document.createElement('button');
                b.className = 'glass-btn px-3 py-1.5 rounded-lg text-xs flex items-center gap-1.5 whitespace-nowrap' + (i === 0 ? ' active' : '');
                b.innerHTML = `<span>${L.emoji}</span><span>${L.name}</span>`;
                b.addEventListener('click', () => {
                    app.facadeGen.landmarkIndex = i;
                    app.facadeGen.tourTimer = 0;
                    updateCaption(i);
                });
                lmBox.appendChild(b);
                lmButtons.push(b);
            });
            app.facadeGen.onLandmarkChange = updateCaption;
            updateCaption(0);

            const btnTour = document.getElementById('btn-tour');
            btnTour.addEventListener('click', () => {
                app.facadeGen.tour = !app.facadeGen.tour;
                app.facadeGen.tourTimer = 0;
                btnTour.classList.toggle('active', app.facadeGen.tour);
                btnTour.querySelector('span').textContent = '环球巡游 ' + (app.facadeGen.tour ? 'ON' : 'OFF');
            });

            const ceText = document.getElementById('ce-text');
            const ceMode = document.getElementById('ce-mode');
            const ceBg = document.getElementById('ce-bg');
            const ceSize = document.getElementById('ce-size');
            const ceChips = document.getElementById('ce-chips');
            const customSubBtn = document.querySelector('.emoji-sub-btn[data-emoji="custom"]');

            function activateCustomEmoji() {
                emojiSubButtons.forEach(b => b.classList.remove('active'));
                customSubBtn.classList.add('active');
                app.facadeGen.activeEmoji = 'custom';
            }
            ceText.addEventListener('input', (e) => {
                app.facadeGen.customEmoji.text = e.target.value || '🙂';
                activateCustomEmoji();
            });
            ceMode.addEventListener('click', () => {
                const single = ceMode.dataset.mode === 'single';
                ceMode.dataset.mode = single ? 'tile' : 'single';
                ceMode.textContent = single ? '平铺 Tiled' : '单个 Single';
                ceMode.classList.toggle('active', single);
                app.facadeGen.customEmoji.mode = ceMode.dataset.mode;
                activateCustomEmoji();
            });
            ceBg.addEventListener('input', (e) => { app.facadeGen.customEmoji.bg = e.target.value; });
            ceSize.addEventListener('input', (e) => { app.facadeGen.customEmoji.size = parseInt(e.target.value); });
            ['🚀', '🐉', '🍕', '🎃', '🌸', '🐱', '⚽', '🎂', '👽', '🔥', '🌈', '🦄', '💎', '🎸'].forEach(em => {
                const c = document.createElement('button');
                c.className = 'glass-btn px-2 py-0.5 rounded-lg';
                c.textContent = em;
                c.addEventListener('click', () => {
                    ceText.value = em;
                    app.facadeGen.customEmoji.text = em;
                    activateCustomEmoji();
                });
                ceChips.appendChild(c);
            });

            const btnAudio = document.getElementById('btn-audio');
            const audioIcon = document.getElementById('audio-icon');

            btnAudio.addEventListener('click', () => {
                const isPlaying = audioEngine.toggle();
                if (isPlaying) {
                    btnAudio.classList.add('active');
                    audioIcon.className = 'fa-solid fa-volume-high text-cyan-400';
                } else {
                    btnAudio.classList.remove('active');
                    audioIcon.className = 'fa-solid fa-volume-xmark';
                }
            });

            const btnRotate = document.getElementById('btn-rotate');
            btnRotate.addEventListener('click', () => {
                app.controls.autoRotate = !app.controls.autoRotate;
                if (app.controls.autoRotate) {
                    btnRotate.classList.add('active');
                } else {
                    btnRotate.classList.remove('active');
                }
            });

            const btnFullscreen = document.getElementById('btn-fullscreen');
            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            const ctrlMode = document.getElementById('ctrl-mode');
            const ctrlText = document.getElementById('ctrl-text');
            const ctrlColor1 = document.getElementById('ctrl-color1');
            const ctrlColor2 = document.getElementById('ctrl-color2');
            const ctrlSpeed = document.getElementById('ctrl-speed');
            const valSpeed = document.getElementById('val-speed');
            const ctrlDensity = document.getElementById('ctrl-density');
            const valDensity = document.getElementById('val-density');
            const ctrlIntensity = document.getElementById('ctrl-intensity');
            const valIntensity = document.getElementById('val-intensity');

            ctrlMode.addEventListener('change', (e) => {
                app.facadeGen.params.mode = e.target.value;
            });

            ctrlText.addEventListener('input', (e) => {
                app.facadeGen.params.text = e.target.value || 'VEGAS';
            });

            ctrlColor1.addEventListener('input', (e) => {
                app.facadeGen.params.color1 = e.target.value;
            });

            ctrlColor2.addEventListener('input', (e) => {
                app.facadeGen.params.color2 = e.target.value;
            });

            ctrlSpeed.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                app.facadeGen.params.speed = val;
                valSpeed.textContent = `${val.toFixed(1)}x`;
            });

            ctrlDensity.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                app.facadeGen.params.density = val;
                valDensity.textContent = val > 80 ? 'Ultra' : val > 48 ? 'High' : 'Medium';
            });

            ctrlIntensity.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                app.facadeGen.params.intensity = val;
                valIntensity.textContent = val.toFixed(1);
            });
        };
    </script>
</body>
